name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o JasonArabicQuest-Prototype.zip -d .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: cd JasonArabicQuest && gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JasonArabicQuest-debug
          path: JasonArabicQuest/app/build/outputs/apk/debug/app-debug.apk
